[package]
name = "noise-generation-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
noise = "0.9"
clap = { version = "4", features = ["derive"] }
fastnoise-lite = "1.1.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
