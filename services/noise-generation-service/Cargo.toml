[package]
name = "noise-generation-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Für noise-rs
noise = "0.9"
# Für FastNoiseLite (Rust-Wrapper)
fastnoise-lite = "0.1"
# Für den Web-Server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
