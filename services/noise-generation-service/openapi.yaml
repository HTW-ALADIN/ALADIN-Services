openapi: 3.1.0
info:
  title: Noise Generation Service API
  version: 1.0.0
  description: Unified REST API for noise generation libraries.

paths:
  /v1/algorithms:
    get:
      summary: List all algorithm/backend combinations
      responses:
        '200':
          description: A list of algorithms and their metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    algorithm: { type: string }
                    backend: { type: string }
                    metadata: { type: object }

  /v1/noise:
    post:
      summary: Generate/sample noise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateNoiseRequest'
      responses:
        '201':
          description: Noise field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoiseField'
        '202':
          description: Noise field generation accepted (async)
          headers:
            Location:
              schema: { type: string }

  /v1/noise/{fieldId}:
    get:
      summary: Retrieve a noise field
      parameters:
        - name: fieldId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Noise field data
    delete:
      summary: Release a noise field resource
      parameters:
        - name: fieldId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Noise field deleted

components:
  schemas:
    GenerateNoiseRequest:
      oneOf:
        - $ref: '#/components/schemas/PerlinRequest'
        - $ref: '#/components/schemas/CellularRequest'
      discriminator:
        propertyName: algorithm
        mapping:
          perlin: '#/components/schemas/PerlinRequest'
          cellular: '#/components/schemas/CellularRequest'

    PerlinRequest:
      type: object
      required: [algorithm, params, sampling]
      properties:
        algorithm: { const: perlin }
        backend: { enum: [fastnoise_lite, noise_rs] }
        params: { type: object }
        sampling: { $ref: '#/components/schemas/Sampling' }
        output: { $ref: '#/components/schemas/Output' }

    CellularRequest:
      type: object
      required: [algorithm, backend, params, sampling]
      properties:
        algorithm: { const: cellular }
        backend: { enum: [fastnoise_lite, noise_rs] }
        params: { type: object }
        sampling: { $ref: '#/components/schemas/Sampling' }
        output: { $ref: '#/components/schemas/Output' }

    Sampling:
      type: object
      properties:
        mode: { enum: [point, points, grid] }
        dimensions: { type: integer }
        grid: { type: object }

    Output:
      type: object
      properties:
        format: { enum: [raw_f32, json_array, png_heightmap, npy] }
        normalize: { enum: [neg1_1, zero_one] }

    NoiseField:
      type: object
      properties:
        id: { type: string }
        status: { enum: [pending, completed, failed] }
        algorithm: { type: string }
        backend: { type: string }
        params: { type: object }
        sampling: { type: object }
        metadata: { type: object }
        _links: { type: object }
