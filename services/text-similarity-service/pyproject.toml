[project]
name = "text-similarity-service"
version = "0.1.0"
description = "Unified REST API for semantic text similarity — 13 algorithm families over 6 backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "nltk>=3.9.0",
    "scikit-learn>=1.6.0",
    "httpx>=0.27.0",
    # CLI (mirrors the REST endpoints)
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Model-based measures. These pull in PyTorch (~2.5 GB CUDA wheel via
# sentence-transformers / bert-score) and/or download large models at runtime
# (HuggingFace for SBERT/BERTScore, gensim glove for embedding_cosine/wmd).
# They are therefore NOT installed by default — the base service and Docker
# image stay small. Install on demand with:
#   pip install -e ".[model]"
# The model-backed endpoints return a clean 501 error when this extra is
# missing (all imports are lazy, so the rest of the service is unaffected).
model = [
    "sentence-transformers>=3.0.0",
    "gensim>=4.4.0",
    # BERTScore is flagged inactive upstream (no release in 12+ months).
    # Pin to the exact latest version and treat as vendored.
    "bert-score==0.3.13",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "ruff>=0.6.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
text-similarity = "src.cli:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model_download: tests that download models from HuggingFace (skipped by default)",
]