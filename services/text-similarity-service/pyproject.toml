[project]
name = "text-similarity-service"
version = "0.1.0"
description = "Unified REST API for text similarity — 23 algorithm families over 8 backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "nltk>=3.9.0",
    "rapidfuzz>=3.14.0",
    "sentence-transformers>=3.0.0",
    "gensim>=4.4.0",
    "scikit-learn>=1.6.0",
    "textdistance>=4.6.0",
    # BERTScore is flagged inactive upstream (no release in 12+ months).
    # Pin to the exact latest version and treat as vendored.
    "bert-score==0.3.13",
    "httpx>=0.27.0",
    # CLI (mirrors the REST endpoints)
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "ruff>=0.6.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
text-similarity = "src.cli:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model_download: tests that download models from HuggingFace (skipped by default)",
]