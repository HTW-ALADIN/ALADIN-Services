[project]
name = "text-similarity-service"
version = "0.1.0"
description = "Unified REST API for semantic text similarity — 16 algorithm families over multiple backends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "nltk>=3.9.0",
    "scikit-learn>=1.6.0",
    # Static word embeddings (embedding_cosine/wmd). Pure NumPy/Python — NO
    # PyTorch dependency, so it belongs in the base tier like nltk/sklearn.
    "gensim>=4.4.0",
    "httpx>=0.27.0",
    # CLI (mirrors the REST endpoints)
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# PyTorch-based measures only (sentence-transformers / bert-score). Everything
# in this extra pulls in PyTorch (~2.5 GB CUDA wheel), which is why it is NOT
# installed by default — the base service and Docker image stay small. Install
# on demand with:
#   pip install -e ".[model]"
# The model-backed endpoints return a clean 501 error when this extra is
# missing (all imports are lazy, so the rest of the service is unaffected).
model = [
    "sentence-transformers>=3.0.0",
    # BERTScore is flagged inactive upstream (no release in 12+ months).
    # Pin to the exact latest version and treat as vendored.
    "bert-score==0.3.13",
]
# German lexical relations via Odenet (Open German WordNet). ``wn`` is a small
# pure-Python library (no PyTorch); the Odenet data itself is downloaded on
# first use via ``python -m wn download odenet:1.4``. Kept separate from
# ``model`` so enabling German lexical lookups never pulls in the 2.5 GB
# PyTorch stack.
de = [
    "wn>=1.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "ruff>=0.6.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
text-similarity = "src.cli:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Model-download tests (BERTScore etc.) are skipped by default so the base
# suite stays fast and offline. Run them explicitly with `-m model_download`.
# Network tests (real api.conceptnet.io calls) are likewise skipped by default.
addopts = "-m 'not model_download and not network'"
markers = [
    "model_download: tests that download models from HuggingFace (skipped by default)",
    "network: tests that hit external public APIs like api.conceptnet.io (skipped by default)",
]