[package]
name = "text-template-service"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stateless REST and CLI wrapper around MiniJinja"

[dependencies]
axum = "0.7.9"
clap = { version = "4.5", features = ["derive"] }
minijinja = { version = "=2.24.0", default-features = false, features = [
    "adjacent_loop_items",
    "builtins",
    "fuel",
    "json",
    "macros",
    "multi_template",
    "serde",
    "std_collections",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
utoipa = { version = "5.5", features = ["axum_extras"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
