services:
  langgraph-service:
    build:
      context: .
    image: langgraph-service
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    environment:
      LLM_GATEWAY_BASE_URL: http://llm-gateway-service:8002
      HTTP_INTERNAL_HOST_ALLOWLIST: ${HTTP_INTERNAL_HOST_ALLOWLIST:-}
      LANGGRAPH_CHECKPOINTER: ${LANGGRAPH_CHECKPOINTER:-memory}
      POSTGRES_URL: ${POSTGRES_URL:-}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:17
    profiles:
      - postgres
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: langgraph
    volumes:
      - langgraph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  langgraph-postgres-data:
