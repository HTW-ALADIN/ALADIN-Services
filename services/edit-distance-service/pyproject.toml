[project]
name = "edit-distance-service"
version = "0.1.0"
description = "Unified microservice for text edit distance and graph edit distance algorithms"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# NOTE: gmatch4py (installed by default, see below) unconditionally imports
# `numpy.distutils` on package import; NumPy removed `numpy.distutils` for
# Python >= 3.12 (no workaround exists), so this service cannot support
# Python 3.12+ until gmatch4py drops that dependency.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.14.0",
    "textdistance>=4.6.0",
    "jellyfish>=1.1.0",
    "edlib>=1.3.9",
    "diff-match-patch>=20230430",
    "networkx>=3.6.0",
    # gmatch4py's compiled Cython extensions are built against the NumPy 1.x
    # ABI and are not compatible with NumPy 2.x (see Quick Start / Docker
    # notes below on gmatch4py). Keep this ceiling until gmatch4py is
    # rebuilt for NumPy 2.
    "numpy>=1.26.0,<2.0",
    "scipy>=1.12.0",
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "ruff>=0.6.0",
]
# NOTE: gmatch4py (ged_hausdorff, ged_greedy, and the gmatch4py backend of
# ged_heuristic) is installed by default via `make prep` / the Dockerfile,
# not through an extra here — it is not published on PyPI, so it cannot be
# expressed as a normal PEP 508 dependency without pinning a VCS commit
# (see the Makefile's GMATCH4PY_REF and the README's "Graph backends"
# section for the exact command and required environment).
#
# GEDLIB (gedlibpy, the "gedlib" backend of ged_astar/ged_heuristic) has no
# PyPI package either, and building it additionally requires the full
# GEDLIB C++ library (CMake, Boost, SWIG, ...). It is therefore not
# installed by default and not covered by CI/Docker; install it manually
# and it will be picked up automatically at runtime if desired.

[project.scripts]
edit-distance = "src.cli:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]