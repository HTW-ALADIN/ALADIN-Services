[project]
name = "edit-distance-service"
version = "0.1.0"
description = "Unified microservice for text edit distance and graph edit distance algorithms"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rapidfuzz>=3.14.0",
    "textdistance>=4.6.0",
    "jellyfish>=1.1.0",
    "edlib>=1.3.9",
    "diff-match-patch>=20230430",
    "networkx>=3.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]
graph = [
    "gedlibpy>=0.3.0",
    "gmatch4py>=0.4.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
edit-distance-service = "cli:cli"

[tool.setuptools.packages.find]
where = ["src"]