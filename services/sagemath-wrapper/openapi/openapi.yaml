components:
  schemas:
    ConstraintModel:
      properties:
        coeffs:
          additionalProperties:
            type: number
          type: object
          title: Coeffs
        min:
          anyOf:
          - type: number
          - type: 'null'
          title: Min
        max:
          anyOf:
          - type: number
          - type: 'null'
          title: Max
      type: object
      required:
      - coeffs
      title: ConstraintModel
    FindRootRequest:
      properties:
        expression:
          type: string
          title: Expression
          description: Symbolic expression
        variable:
          type: string
          title: Variable
          description: Variable name
          default: x
        a:
          type: number
          title: A
          description: Interval start
        b:
          type: number
          title: B
          description: Interval end
      type: object
      required:
      - expression
      - a
      - b
      title: FindRootRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LinalgResponse:
      properties:
        result:
          anyOf:
          - items: {}
            type: array
          - type: number
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      title: LinalgResponse
    LinearSystemRequest:
      properties:
        a:
          items:
            items:
              type: number
            type: array
          type: array
          title: A
          description: Coefficient matrix
        b:
          items:
            type: number
          type: array
          title: B
          description: Right-hand side vector
      type: object
      required:
      - a
      - b
      title: LinearSystemRequest
    MatrixRequest:
      properties:
        matrix:
          items:
            items:
              type: number
            type: array
          type: array
          title: Matrix
          description: Square matrix
      type: object
      required:
      - matrix
      title: MatrixRequest
    MaximaEvaluateRequest:
      properties:
        expression:
          type: string
          title: Expression
          description: Symbolic expression
        operation:
          type: string
          title: Operation
          description: 'Operation: simplify, differentiate, integrate, solve, limit,
            series, laplace'
        variable:
          type: string
          title: Variable
          description: Variable name
          default: x
        bounds:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Bounds
          description: 'For limit: [point]; for series: [point, order]; for integrate:
            [a, b]'
      type: object
      required:
      - expression
      - operation
      title: MaximaEvaluateRequest
    MaximaEvaluateResponse:
      properties:
        result:
          anyOf:
          - type: string
          - type: number
          - items: {}
            type: array
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      title: MaximaEvaluateResponse
    MilpRequest:
      properties:
        variables:
          items:
            type: string
          type: array
          title: Variables
        objective:
          additionalProperties:
            type: number
          type: object
          title: Objective
        maximize:
          type: boolean
          title: Maximize
          default: true
        constraints:
          items:
            $ref: '#/components/schemas/ConstraintModel'
          type: array
          title: Constraints
        var_types:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Var Types
        solver:
          type: string
          title: Solver
          description: MILP solver name
          default: GLPK
      type: object
      required:
      - variables
      - objective
      title: MilpRequest
    MilpResponse:
      properties:
        status:
          type: string
          title: Status
        objective_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Objective Value
        values:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Values
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - status
      title: MilpResponse
    MinimizeRequest:
      properties:
        expression:
          type: string
          title: Expression
          description: Symbolic expression
        variables:
          items:
            type: string
          type: array
          title: Variables
          description: Variable names
        x0:
          items:
            type: number
          type: array
          title: X0
          description: Initial guess
        objective_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Objective Value
        values:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Values
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - expression
      - variables
      - x0
      title: MinimizeRequest
    SatSolveRequest:
      properties:
        clauses:
          items:
            items:
              type: integer
            type: array
          type: array
          title: Clauses
          description: DIMACS CNF clauses
        solver:
          type: string
          title: Solver
          description: SAT solver name
          default: picosat
      type: object
      required:
      - clauses
      title: SatSolveRequest
    SatSolveResponse:
      properties:
        satisfiable:
          type: boolean
          title: Satisfiable
        assignment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Assignment
        solver:
          type: string
          title: Solver
      type: object
      required:
      - satisfiable
      - solver
      title: SatSolveResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
