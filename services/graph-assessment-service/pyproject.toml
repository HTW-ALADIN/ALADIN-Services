[project]
name = "graph-assessment-service"
version = "0.1.0"
description = "Compares entity-relationship diagrams with a reference solution and gives feedback"
readme = "README.md"
requires-python = ">=3.11"
# Lower bound = the oldest version that has the calls used here.
# Upper bound = the next major version, which has not been tested.
dependencies = [
    "jsonschema>=4.18,<5",  # checks the diagram JSON against notations/<NOTATION>/
    "networkx>=3.1,<4",     # builds, compares and probes the graphs
    "pydantic>=2.0,<3",     # notation model and semantic settings
    "wn>=0.9,<2",           # OdeNet (German wordnet): synonyms
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
