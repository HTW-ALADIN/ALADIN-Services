[project]
name = "graph-generation-service"
version = "0.1.0"
description = "Unified FastAPI graph-generation API with backend-specific validation and adapter routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "igraph>=0.11.8",
    "networkit>=11.1.0",
    "networkx>=3.4.2",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=1.15.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "types-networkx>=3.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.bootstrap-venv",
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/coverage.xml",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["igraph", "networkit", "networkit.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
