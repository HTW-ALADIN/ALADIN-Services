services:
  graph-generation-service:
    build:
      context: .
    image: graph-generation-service
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    environment:
      GRAPH_TOOL_SIDECAR_URL: http://graph-tool-sidecar:8003
      GRAPH_CONCURRENCY: "1"
    ports:
      - "8002:8002"
    depends_on:
      graph-tool-sidecar:
        condition: service_healthy

  graph-tool-sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    image: graph-tool-sidecar
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    environment:
      GRAPH_CONCURRENCY: "1"
