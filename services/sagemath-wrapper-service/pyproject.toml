[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemath-wrapper"
version = "0.1.0"
description = "HTTP/CLI wrapper around SageMath for symbolic computation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "jinja2>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that exercise the full SageMath stack",
    "docker: marks tests that require a Docker daemon",
]
addopts = "--cov=src --cov-report=xml:coverage.xml --cov-report=term-missing -m 'not integration and not docker'"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100