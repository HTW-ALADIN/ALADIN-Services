# ── Template entries (no new Python code needed) ──────────────────────────────

- id: linalg.kernel
  summary: Right kernel (nullspace) basis matrix
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        items:
          type: array
          items:
            type: number
    required: [matrix]
  output_type: matrix
  timeout_s: 5.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    __result__ = A.kernel().basis_matrix().rows()

- id: linalg.echelon_form
  summary: Row echelon form of a matrix
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        items:
          type: array
          items:
            type: number
    required: [matrix]
  output_type: matrix
  timeout_s: 5.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    __result__ = A.echelon_form().rows()

- id: linalg.rank
  summary: Rank of a matrix
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        items:
          type: array
          items:
            type: number
    required: [matrix]
  output_type: scalar
  timeout_s: 5.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    __result__ = A.rank()

- id: linalg.matrix_vector_product
  summary: Matrix-vector product A * v
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        items:
          type: array
          items:
            type: number
      vector:
        type: array
        items:
          type: number
    required: [matrix, vector]
  output_type: vector
  timeout_s: 5.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    v = vector({{ vector|sage_literal }})
    __result__ = list(A * v)

- id: linalg.vector_matrix_product
  summary: Vector-matrix product v * A
  kind: template
  input_schema:
    type: object
    properties:
      vector:
        type: array
        items:
          type: number
      matrix:
        type: array
        items:
          type: array
          items:
            type: number
    required: [vector, matrix]
  output_type: vector
  timeout_s: 5.0
  sage_template: |
    v = vector({{ vector|sage_literal }})
    A = Matrix({{ matrix|sage_literal }})
    __result__ = list(v * A)
