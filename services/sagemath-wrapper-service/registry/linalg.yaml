- id: linalg.kernel
  summary: Right kernel (nullspace) basis matrix
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        maxItems: 1000
        items:
          type: array
          maxItems: 1000
          items:
            type: number
    required: [matrix]
  output_type: matrix
  timeout_s: 5.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    __result__ = [list(row) for row in A.kernel().basis_matrix().rows()]

