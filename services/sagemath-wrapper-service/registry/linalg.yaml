- id: linalg.eigenvectors_left
  summary: Left eigenvectors with eigenvalues and multiplicities
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        maxItems: 1000
        items:
          type: array
          maxItems: 1000
          items:
            type: number
    required: [matrix]
  output_type: object
  timeout_s: 10.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    raw = A.eigenvectors_left()
    __result__ = []
    for eigval, eigvecs, mult in raw:
        __result__.append({
            "eigenvalue": eigval,
            "eigenvectors": [list(v) for v in eigvecs],
            "multiplicity": mult
        })

- id: linalg.eigenvectors_right
  summary: Right eigenvectors with eigenvalues and multiplicities
  kind: template
  input_schema:
    type: object
    properties:
      matrix:
        type: array
        maxItems: 1000
        items:
          type: array
          maxItems: 1000
          items:
            type: number
    required: [matrix]
  output_type: object
  timeout_s: 10.0
  sage_template: |
    A = Matrix({{ matrix|sage_literal }})
    raw = A.eigenvectors_right()
    __result__ = []
    for eigval, eigvecs, mult in raw:
        __result__.append({
            "eigenvalue": eigval,
            "eigenvectors": [list(v) for v in eigvecs],
            "multiplicity": mult
        })

- id: linalg.evaluate
  summary: Evaluate a SageMath matrix expression with named matrices and vectors
  kind: function
  input_schema:
    type: object
    properties:
      matrices:
        type: object
        description: "Named matrices as {name: [[row], ...]}"
        propertyNames:
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
        additionalProperties:
          type: array
          maxItems: 1000
          items:
            type: array
            maxItems: 1000
            items:
              type: number
      vectors:
        type: object
        description: "Named vectors as {name: [...]}"
        propertyNames:
          pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$"
        additionalProperties:
          type: array
          maxItems: 1000
          items:
            type: number
      expression:
        type: string
        maxLength: 1000
        description: "SageMath matrix expression using the named matrices/vectors and an allowlisted set of methods"
    required: [expression]
  output_type: object
  timeout_s: 30.0
  function_ref: "src.core.linalg:evaluate_expression"
