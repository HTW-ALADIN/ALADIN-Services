name: natural-language-generation-service

on:
  push:
    branches: ["master"]
    paths:
      - "services/natural-language-generation-service/**"
      - ".github/workflows/service-natural-language-generation-service.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/natural-language-generation-service/**"
      - ".github/workflows/service-natural-language-generation-service.yml"

defaults:
  run:
    working-directory: services/natural-language-generation-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/natural-language-generation-service/package-lock.json
      - run: npm ci
      - run: make lint

  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/natural-language-generation-service/package-lock.json
      - run: npm ci
      - run: make build
      - run: make test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: services/natural-language-generation-service/coverage/lcov.info
          flags: natural-language-generation-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  openapi:
    name: Generate OpenAPI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/natural-language-generation-service/package-lock.json
      - run: npm ci
      - run: make generate-openapi
      - name: Check committed OpenAPI document
        run: git diff --exit-code -- openapi/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-natural-language-generation-service
          path: services/natural-language-generation-service/openapi/openapi.json

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: openapi
    steps:
      - uses: actions/checkout@v4
      - run: make docker-smoke

  publish:
    name: Publish container
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/natural-language-generation-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: services/natural-language-generation-service
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
