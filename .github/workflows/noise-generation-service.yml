name: Noise Generation Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: |
        cd services/noise-generation-service
        cargo build --verbose

    - name: Run tests
      run: |
        cd services/noise-generation-service
        cargo test --verbose

    - name: Check formatting
      run: |
        cd services/noise-generation-service
        cargo fmt --check

    - name: Clippy linting
      run: |
        cd services/noise-generation-service
        cargo clippy --verbose