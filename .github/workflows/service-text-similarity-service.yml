name: text-similarity-service

on:
  push:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"

# ─────────────────────────────────────────────────────────────────────────────
# DKPro sidecar (dkpro-sidecar/) is OPTIONAL:
#
#   COST    — DKPro Similarity is a Java/Apache UIMA stack. The artifacts are
#             not on Maven Central, so building it requires cloning
#             https://github.com/dkpro/dkpro-similarity and building from
#             source. It needs JDK 21 + Maven + the UIMA runtime, and is
#             ~8 years stale upstream.
#
#   BENEFIT — It adds exactly 2 families (topic_model #22, structural_
#             stylistic #23) to go from 21/23 (91%) to 23/23 (100%) coverage.
#             The 5 additional DKPro backend variants (token_set, lcs,
#             phonetic, tfidf_cosine, wordnet_similarity) add NO new family
#             coverage — only alternative implementations of already-covered
#             tags, and are also skippable.
#
#   The Python service runs and is tested WITHOUT the sidecar; the sidecar
#   job below only runs when files under dkpro-sidecar/ changed, and even
#   then it's non-blocking for the Python path.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    working-directory: services/text-similarity-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff linting
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v --tb=short
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/text-similarity-service/coverage.xml
          flags: text-similarity-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build
        run: make build

  # ── OPTIONAL: DKPro Java sidecar ─────────────────────────────────────────
  # Only runs when dkpro-sidecar/** changed. Non-blocking for the Python path
  # (no job depends on it). If you never need families 22–23, delete this job
  # and the dkpro-sidecar/ directory — the Python service still passes all
  # tests without them.
  dkpro-sidecar:
    name: DKPro sidecar (optional, Java)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'services/text-similarity-service/dkpro-sidecar/') ||
      startsWith(github.ref, 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test sidecar
        working-directory: services/text-similarity-service/dkpro-sidecar
        run: |
          mvn test
          mvn package -DskipTests