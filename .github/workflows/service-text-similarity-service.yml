name: text-similarity-service

on:
  push:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"

# ─────────────────────────────────────────────────────────────────────────────
# DKPro sidecar (dkpro-sidecar/) is OPTIONAL:
#
#   COST    — DKPro Similarity is a Java/Apache UIMA stack. The artifacts are
#             not on Maven Central, so building it requires cloning
#             https://github.com/dkpro/dkpro-similarity and building from
#             source. It needs JDK 21 + Maven + the UIMA runtime, and is
#             ~8 years stale upstream.
#
#   BENEFIT — It adds exactly 2 families (topic_model, structural_stylistic)
#             out of the 17 semantic families. The optional dkpro backend
#             variants (tfidf_cosine, wordnet_similarity) add NO new family
#             coverage — only alternative implementations of already-covered
#             tags, and are also skippable.
#
#   The Python service runs and is tested WITHOUT the sidecar; the sidecar
#   job below only runs when files under dkpro-sidecar/ changed, and even
#   then it's non-blocking for the Python path.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    working-directory: services/text-similarity-service

# Least-privilege default; the `build` job only escalates to the GHA packages
# (image write) scope it needs, and only on a push to master.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff linting
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        # Model-based measures need the optional `model` extra (PyTorch,
        # ~2.5 GB) and download HuggingFace/gensim models; live network tests
        # hit public APIs like api.conceptnet.io. All three are skipped by
        # default, matching the addopts in pyproject.toml. NOTE: an explicit -m
        # here REPLACES addopts -m, so all deselected markers must be restated.
        # --cov generates coverage.xml (used by the Codecov upload below).
        run: pytest -v --tb=short -m "not model_download and not network and not model" --cov=src --cov-report=xml --cov-report=term-missing
      - name: Run smoke tests
        run: |
          set -e
          # Start the server in the background
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!

          # Wait for the server to be ready; fail loudly if it never comes up
          # (the health checks below would otherwise error unhelpfully).
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Server is ready"
              READY=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to become ready within 30s" >&2
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Smoke test: health endpoint
          echo "=== Health check ==="
          curl -sf http://localhost:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', f'Health failed: {d}'"
          echo "Health: OK"

          # Smoke test: algorithms discovery
          echo "=== Text algorithms discovery ==="
          curl -sf http://localhost:8000/v1/similarity/text/algorithms | python -c "import sys,json; d=json.load(sys.stdin); assert len(d)>0, 'No algorithms'; print(f'Found {len(d)} algorithm/backend entries')"

          # Smoke test: distance compute (token-set Jaccard — base, no model)
          echo "=== Distance compute ==="
          curl -sf -X POST http://localhost:8000/v1/similarity/text/distance \
            -H 'Content-Type: application/json' \
            -d '{"algorithm":"jaccard","params":{},"inputs":[{"id":"p1","a":"the cat is here","b":"the cat is there"}]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['algorithm']=='jaccard'; assert len(d['results'])==1; assert d['results'][0]['result']['similarity']==0.6; print('Jaccard: OK')"

          # Smoke test: retrieval compute (BM25 — base, no model)
          echo "=== Retrieval compute ==="
          curl -sf -X POST http://localhost:8000/v1/similarity/text/retrieval \
            -H 'Content-Type: application/json' \
            -d '{"algorithm":"bm25","params":{},"inputs":[{"id":"q1","query":"cat","candidates":["a cat","a dog","house"]}]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['algorithm']=='bm25'; assert d['results'][0]['result']['count']>0; print('BM25: OK')"

          echo "=== All smoke tests passed ==="

          # Stop the server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/text-similarity-service/coverage.xml
          flags: text-similarity-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: always()

  # ── PyTorch profile (text-similarity-pytorch build) ─────────────────────────
  # Heavy on purpose: installs the `model` extra (PyTorch ~2.5 GB) and runs the
  # pytorch-profile end-to-end compute tests (real SBERT models, ~90-440 MB
  # downloads). This validates that the pytorch image's algorithms actually work
  # end-to-end, not just that they're advertised. Kept separate from `test` so
  # the fast base path stays quick; only these `model_download` tests run here.
  pytorch-test:
    name: PyTorch Build Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-model-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies (with model extra)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,model]"
      - name: Run PyTorch profile compute tests
        # Only the pytorch-profile model tests (marked model_download). Network
        # tests stay deselected. An explicit -m replaces addopts, so both are stated.
        run: pytest -v --tb=short -m "model_download and not network" tests/test_async.py::TestPytorchProfileCompute

  generate-openapi:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate OpenAPI spec
        run: make generate-openapi
      - name: Upload OpenAPI specs
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-text-similarity-service
          path: |
            services/text-similarity-service/text-similarity-service-cpu.openapi.json
            services/text-similarity-service/text-similarity-service-pytorch.openapi.json

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: generate-openapi
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # One repo builds two images; they differ only in the PyTorch
        # algorithms they ship. Tags: text-similarity-cpu, text-similarity-pytorch.
        include:
          - image: text-similarity-cpu
            profile: cpu
            install_model: "false"
          - image: text-similarity-pytorch
            profile: pytorch
            install_model: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/text-similarity-service
          file: services/text-similarity-service/Dockerfile
          build-args: |
            SIMILARITY_PROFILE=${{ matrix.profile }}
            INSTALL_MODEL=${{ matrix.install_model }}
          # Reuse layers across CI runs: without this, the ~2.5 GB PyTorch layer
          # is re-downloaded on every push to master. `type=gha` uses the GitHub
          # Actions cache backend scoped to this project/branch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── OPTIONAL: DKPro Java sidecar ─────────────────────────────────────────
  # Only runs when dkpro-sidecar/** actually changed (either in a PR or in a
  # push). The previous `contains(github.event.pull_request.changed_files, ...)`
  # check was wrong: GitHub Actions does not expose such an array on the event,
  # so the job never ran for PRs. We detect changed paths reliably with
  # dorny/paths-filter. Non-blocking for the Python path (nothing depends on it);
  # if you never need topic_model / structural_stylistic, delete this job and
  # the dkpro-sidecar/ directory — the Python service passes all tests without it.
  dkpro-changes:
    runs-on: ubuntu-latest
    outputs:
      dkpro: ${{ steps.filter.outputs.dkpro }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed by dorny/paths-filter to diff against the base branch.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dkpro:
              - 'services/text-similarity-service/dkpro-sidecar/**'

  dkpro-sidecar:
    name: DKPro sidecar (optional, Java)
    runs-on: ubuntu-latest
    needs: dkpro-changes
    # Only build the sidecar when its files actually changed (PR or push);
    # paths-filter diffs against the base ref / previous commit for both.
    if: needs.dkpro-changes.outputs.dkpro == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test sidecar
        working-directory: services/text-similarity-service/dkpro-sidecar
        run: |
          mvn test
          mvn package -DskipTests