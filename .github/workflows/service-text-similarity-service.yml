name: text-similarity-service

on:
  push:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/text-similarity-service/**"
      - ".github/workflows/service-text-similarity-service.yml"

# ─────────────────────────────────────────────────────────────────────────────
# DKPro sidecar (dkpro-sidecar/) is OPTIONAL:
#
#   COST    — DKPro Similarity is a Java/Apache UIMA stack. The artifacts are
#             not on Maven Central, so building it requires cloning
#             https://github.com/dkpro/dkpro-similarity and building from
#             source. It needs JDK 21 + Maven + the UIMA runtime, and is
#             ~8 years stale upstream.
#
#   BENEFIT — It adds exactly 2 families (topic_model, structural_stylistic)
#             out of the 17 semantic families. The optional dkpro backend
#             variants (tfidf_cosine, wordnet_similarity) add NO new family
#             coverage — only alternative implementations of already-covered
#             tags, and are also skippable.
#
#   The Python service runs and is tested WITHOUT the sidecar; the sidecar
#   job below only runs when files under dkpro-sidecar/ changed, and even
#   then it's non-blocking for the Python path.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    working-directory: services/text-similarity-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff linting
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        # Model-based measures need the optional `model` extra (PyTorch,
        # ~2.5 GB) and download HuggingFace/gensim models; live network tests
        # hit public APIs like api.conceptnet.io. Both are skipped by default,
        # matching the addopts in pyproject.toml. NOTE: an explicit -m here
        # REPLACES addopts -m, so both markers must be restated.
        run: pytest -v --tb=short -m "not model_download and not network"
      - name: Run smoke tests
        run: |
          set -e
          # Start the server in the background
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!

          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done

          # Smoke test: health endpoint
          echo "=== Health check ==="
          curl -sf http://localhost:8000/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', f'Health failed: {d}'"
          echo "Health: OK"

          # Smoke test: algorithms discovery
          echo "=== Text algorithms discovery ==="
          curl -sf http://localhost:8000/v1/text/algorithms | python -c "import sys,json; d=json.load(sys.stdin); assert len(d)>0, 'No algorithms'; print(f'Found {len(d)} algorithm/backend entries')"

          # Smoke test: distance compute (token-set Jaccard — base, no model)
          echo "=== Distance compute ==="
          curl -sf -X POST http://localhost:8000/v1/text/distance \
            -H 'Content-Type: application/json' \
            -d '{"algorithm":"jaccard","params":{},"inputs":[{"id":"p1","a":"the cat is here","b":"the cat is there"}]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['algorithm']=='jaccard'; assert len(d['results'])==1; assert d['results'][0]['result']['similarity']==0.6; print('Jaccard: OK')"

          # Smoke test: retrieval compute (BM25 — base, no model)
          echo "=== Retrieval compute ==="
          curl -sf -X POST http://localhost:8000/v1/text/retrieval \
            -H 'Content-Type: application/json' \
            -d '{"algorithm":"bm25","params":{},"inputs":[{"id":"q1","query":"cat","candidates":["a cat","a dog","house"]}]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['algorithm']=='bm25'; assert d['results'][0]['result']['count']>0; print('BM25: OK')"

          echo "=== All smoke tests passed ==="

          # Stop the server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/text-similarity-service/coverage.xml
          flags: text-similarity-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: always()

  generate-openapi:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/text-similarity-service/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate OpenAPI spec
        run: make generate-openapi
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-text-similarity-service
          path: services/text-similarity-service/text-similarity-service.openapi.json

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: generate-openapi
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/text-similarity-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/text-similarity-service
          file: services/text-similarity-service/Dockerfile
          # Default image stays small (no PyTorch). Build the full model stack
          # with INSTALL_MODEL=true when model-based measures are required.
          build-args: |
            INSTALL_MODEL=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── OPTIONAL: DKPro Java sidecar ─────────────────────────────────────────
  # Only runs when dkpro-sidecar/** changed. Non-blocking for the Python path
  # (no job depends on it). If you never need topic_model / structural_stylistic,
  # delete this job and the dkpro-sidecar/ directory — the Python service still
  # passes all tests without them.
  dkpro-sidecar:
    name: DKPro sidecar (optional, Java)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'services/text-similarity-service/dkpro-sidecar/') ||
      startsWith(github.ref, 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Build and test sidecar
        working-directory: services/text-similarity-service/dkpro-sidecar
        run: |
          mvn test
          mvn package -DskipTests