name: graph-generation-service

on:
  push:
    branches: ["master"]
    paths:
      - "services/graph-generation-service/**"
      - ".github/workflows/service-graph-generation-service.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "services/graph-generation-service/**"
      - ".github/workflows/service-graph-generation-service.yml"

defaults:
  run:
    working-directory: services/graph-generation-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: make test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/graph-generation-service/coverage.xml
          flags: graph-generation-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        if: always()

  generate-openapi:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate OpenAPI spec
        run: make generate-openapi
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-graph-generation-service
          path: services/graph-generation-service/graph-generation-service.openapi.json

  smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    needs: generate-openapi
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose -f compose.yaml up -d --build --wait --wait-timeout 300
      - name: Verify API and sidecar readiness
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8002/healthz
          curl --fail --retry 10 --retry-delay 3 http://localhost:8002/readyz
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [generate-openapi, smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Start bounded graph deployment
        run: docker compose up --build -d --wait
      - name: Verify real backends and resource rejections
        run: python3 test/smoke_containers.py
      - name: Stop smoke deployment
        if: always()
        run: docker compose down
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: primary-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graph-generation-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/graph-generation-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.primary-meta.outputs.tags }}
          labels: ${{ steps.primary-meta.outputs.labels }}
      - name: Extract graph-tool sidecar metadata
        id: sidecar-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/graph-tool-sidecar
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push graph-tool sidecar image
        uses: docker/build-push-action@v6
        with:
          context: services/graph-generation-service
          file: services/graph-generation-service/sidecar/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.sidecar-meta.outputs.tags }}
          labels: ${{ steps.sidecar-meta.outputs.labels }}
